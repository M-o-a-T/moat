port:
  dev: "/dev/ttyACM1"
  socket: "/run/user/501/moat.serialtest"
  guarded: true
app:
  app: dir
  f:
    app: fs.Cmd
  ser:
    app: serial.Raw
    cfg:
      uart: 0
      tx: 0
      rx: 1
      baud: 2400
      max:
        len: 1000
        idle: 500
      start: 0xFF
  batt:
    app: bms.Batt
    running: false

    cmd: bms.BattCmd
    cfg:
      u:
        max: 28.5
        min: 23
        ext:
          max: 28
          min: 23.5
        pin: 26
        scale: 0.000549
        offset: 0
      i:
        max: 5
        min: -5
        ext:
          max: 2
          min: -2
        offset: -0.0335
        pin: 27
        ref: 28
        scale: -0.001
      poll:
        d: 50
        n: 10
        t: 500
      rel:
        pin: 2
        t: 10000
        t1: 1000
