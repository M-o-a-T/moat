[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel",]

[project]
classifiers = [
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Framework :: AsyncIO",
	"Framework :: Trio",
	"Framework :: AnyIO",
	"Development Status :: 4 - Beta",
	]
dependencies = [
	"asyncvictoria ~= 0.6.4",
	"moat-link-metrics ~= 0.1.0",
	]
version = "0.1.0"
keywords = [ "MoaT",]
requires-python = ">=3.13"
name = "moat-link-metrics-backend-victoria"
description = "VictoriaMetrics backend for MoaT-Link metrics"
readme = "README.md"

[[project.authors]]
name = "Matthias Urlichs"
email = "matthias@urlichs.de"

[project.urls]
homepage = "https://m-o-a-t.org"
repository = "https://github.com/M-o-a-T/moat"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]
