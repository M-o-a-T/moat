  await _self.watch(src, cls=_src)
  n = 1
  s1 = True
  s2 = True

  if state1:
      await _self.watch(state1, cls=_f1)
      n += 1
  if state2:
      await _self.watch(state2, cls=_f2)
      n += 1

  if isinstance(seconds, Path):
      await _self.watch(seconds, cls=_dly)
      seconds = None
