backend_example:
  _doc: "Rename to 'backend'"
  typ: mqtt
  codec: std-cbor

  host: localhost
  user: foo
  pass: bar
  ssl:
    cert: '/path/to/cert.pem'
    key: '/path/to/cert.key'
client:
  init_timeout: 5  # set to None to not require a server
  # name: foo

# also in moat/link/_main.py
root: !P XXX.NotConfigured.YZ
qos: 0

# Hostname of the main server.
main: some_host

target:
  # Well-known prefixes off the root

  # this subtree is not stored. Hard-coded into the server, cannot be changed.
  # run: !P run

  # this subtree holds conversion jobs
  conv: !P convert

timeout:
  # time after which deleted entries are flushed
  delete: 100000

  # Ping messages every … seconds
  ping:
    every: 10  # ping transmit frequency
    timeout: 22  # no followup ping received
    stale: 15  # no initial ping received
    delete: 150  # time before removing run.host.* messages
    delay: 3  # no service deletions

  restart:
    error: 30  # generate an error if not back in this many seconds
    flap: 60  # keep the error if it won't stay online this long
    up: 20  # time for service.up to become True

  # client reconnect
  connect:
    initial: 5
    max: 30
    factor: 1.3

  notify:
    retry: 300

error:
  min: 30       # half a minute
  max: 3000000  # a month plus
  ok: 300000    # a weekend plus
