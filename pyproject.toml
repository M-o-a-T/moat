[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel", "setuptools-scm",]

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Framework :: Trio",
    "Framework :: AnyIO",
    "License :: OSI Approved",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "anyio ~= 4.9",
    "bitstring",
    "trio",
    "trio_asyncio",
    "alembic",
    "anyio_serial",
    "asyncactor ~= 0.28.0",
    "asyncakumuli ~= 0.6.2",
    "asyncclick",
    "asyncowfs",
    "asyncscope",
    "asyncvictoria ~= 0.7.0",
    "asyncwago",
    "asyncwebsockets",
    "cffi",
    "cryptography",
    "fpdf2",
    "gitpython",
    "httpx",
    "ifaddr",
    "jmespath",
    "jsonschema",
    "mcp >1.29.1,<2",
    "netaddr",
    "pydantic ~= 2.12",
    "pydantic_variants ~= 0.3",
    "pynacl",
    "outcome",
    "psutil",
    "python-magic",
    "pyfuse3",
    "range_set ~= 0.3",
    "regex",
    "ruyaml",
    "simpleeval",
    "sqlalchemy",
    "stamina",
    "tomlkit",
    "transitions",
    "wsproto",
]
dynamic = [ "version",]
keywords = [ "MoaT",]
requires-python = ">=3.13"
name = "moat"
description = "The compleat MoaT"
readme = "README.md"

[[project.authors]]
email = "matthias@urlichs.de"
name = "Matthias Urlichs"

[project.scripts]
moat = "moat.main:cmd"

[project.license]
file = "LICENSE.txt"

[project.urls]
homepage = "https://m-o-a-t.org"
repository = "https://github.com/M-o-a-T/moat"

[tool.setuptools]
packages = [ "moat",]
[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]

[tool.moat]

[tool.pytest.ini_options]
# addopts = "--cov=moat --cov-report=term-missing -x"
addopts = "-x --no-cov -n 0"
log_cli_level = "DEBUG"
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
# asyncio_default_fixture_loop_scope = "function"

[project.optional-dependencies]
dev = [
    "ansible",
    "asyncdbus ~= 0.7",
    "asyncowfs ~= 0.15",
    "asyncactor ~= 0.27",
    "asyncscope ~= 0.11",
    "asyncwago",
    "bd_warehouse",
    "build123d",
    "cadquery",
    "cbor2",
    "gpiod",
    "httpx-ws",
    "numpy",
    "passlib",
    "pre-commit",
    "pytest-trio",
    "pytest-coverage",
    "pytest-xdist",
    "ruamel.yaml",
    "ruff",
    "setuptools-scm",
    "simplejson",
    "smbus3",
    "systemd",
    "transforms3d",
    "ty == 0.0.75",
    "uv",
    "wheel",
]
ortools = [
    "ortools",
]
doc = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-favicon",
    "sphinx-immaterial",
    "sphinx-tabs",
    "sphinx-toolbox",
    "myst-parser",
    "sphinx-design",
    "sphinx-book-theme",
    "sphinx-last-updated-by-git",
    "sphinx-markdown-builder @ git+https://github.com/M-o-a-T/sphinx-markdown-builder@main",
    "enum_tools[sphinx] @ git+https://github.com/M-o-a-T/enum_tools@bugfix",
    "prometheus_client",
]

[tool.ruff]
preview = true
line-length = 99
target-version = "py311"

exclude = [
    "moat/db/alembic/versions/*",
    "moat/micro/_embed/**/manifest.py",
    "**/OFF/**",
    "TODO/**",
    "packaging/**",
    "ext/**",
    "moat/micro/_embed/lib/mpdb.py",  # symlink
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A003",
    "ANN",
    "ASYNC109",
    "B008", "B028",
    "BLE001",
    "C",
    "COM812",
    "D105", "D107",
    "D2", "D3", "D4",
    "EM10",
    "ERA",
    "FBT",
    "FIX",
    "G004",
    "INP001",
    "N",
    "PERF",
    "PGH003",
    "PIE790",
    "PLC0414",
    "PLR",
    "PLW0603", "PLW1514", "PLW1641",
    "PTH",
    "RET50",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF012", "RUF037",
    "S101", "S307", "S311", "S610", "S701",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM114", "SIM118", "SIM905", "SIM910",
    "T2",
    "TC006",
    "TD",
    "TRY003", "TRY300", "TRY301", "TRY400",
    "UP012", "UP015", "UP040", # "UP038",
    ]

explicit-preview-rules = true

[tool.ruff.lint.extend-per-file-ignores]
"moat/micro/_embed/**" = ["SIM105","B904"]
"moat/mqtt/**" = ["E501","UP031"]
"moat/lib/broadcast/**" = ["UP046"]
"docs/conf.py" = ["ALL"]
"docs/**" = ["D1","F841","TC003"]
"tests/moat_mqtt/**" = ["PT"]
"tests/**" = ["ASYNC240","D104","E501","PLW2901","RUF040","S105","S110","S603","S607"]
"examples/**" = ["S108"]
"ts/**" = ["E402"]
"moat/mcp/_server.py" = ["I002"]
"moat/micro/_test.py" = ["ASYNC240"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["help","id"]

[tool.ruff.lint.isort]
no-lines-before = ["future"]
required-imports = ["from __future__ import annotations"]
section-order = [
    "future",
    "standard-library",
    "first-party",
    "third-party",
    "upy",
    "moat",
    "local-folder",
    "typing",
]
extra-standard-library = ["anyio","pytest"]
force-to-top = ["moat.util"]

[tool.ruff.lint.isort.sections]
moat = ["moat"]
upy = ["asyncio","esp","machine","micropython"]
typing = ["typing","collections"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError:",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
    "moat/api/",
    "moat/cad/",
    "moat/db/__init__.py",
    "moat/db/box/",
    "moat/db/inv/",
    "moat/db/label/",
    "moat/db/thing/",
    "moat/db/rain/",
    "moat/bus/",
    "moat/ems/",
    "moat/lib/",
    "moat/link/",
    "moat/mcp/",
    "moat/micro/",
    "moat/signal/",
    "moat/pdb/",
    "moat/src/",
    "moat/util/",
]
exclude = [
    "ext/**",
    "OFF/**",
    "TODO/**",
    "packaging/**",
    "docs/**",
    "moat/cad/**",
    "moat/lib/victron/**",
    "moat/micro/_embed/**",
    "moat/micro/**/_test.py",
    "moat/micro/**/_test/**",
    "moat/micro/part/pin.py",
    "moat/micro/romfs.py",
    "moat/link/gate/kv.py",
    "moat/link/gate/venus.py",
    "moat/mcp/_server.py",
    # moat/ems: pre-existing typing debt (bucket B+C) outside this task's scope.
    # Remove after introducing a typed sched-config schema (WORK.md step 6).
    "moat/ems/sched/**",
    "moat/ems/battery/OFF/**",
    "moat/ems/battery/_base.py",
    "moat/ems/battery/_main.py",
    "moat/ems/battery/conv/**",
    "moat/ems/battery/diy_serial/**",
    "moat/ems/inv/__init__.py",
    "moat/ems/inv/remote.py",
    "moat/ems/victron/dbus/__init__.py",
    "moat/ems/victron/dbus/monitor.py",
]

[tool.ty.rules]
ambiguous-protocol-member = "error"
division-by-zero = "error"
ignore-comment-unknown-rule = "ignore"
invalid-ignore-comment = "ignore"
redundant-cast = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"
