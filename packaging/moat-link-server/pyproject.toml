[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel",]

[project]
classifiers = [
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Framework :: AsyncIO",
	"Framework :: Trio",
	"Framework :: AnyIO",
	"Development Status :: 4 - Beta",
	]
dependencies = [
	"anyio ~= 4.2",
	"asyncactor ~= 0.28.0",
	"asyncclick ~= 8.3",
	"attrs",
	"ruyaml",
	"simpleeval >= 1.0.7",
	"moat-util ~= 0.64.0",
	"moat-lib-rpc ~= 0.7.6",
	"moat-lib-codec ~= 0.4.20",
	"moat-link ~= 0.11.0",
	"moat-lib-mqtt ~= 0.8.3",
	"moat-lib-config ~= 0.2.2",
	"moat-lib-broadcast ~= 0.1.4",
	]
version = "0.8.0"
keywords = [ "MoaT",]
requires-python = ">=3.8"
name = "moat-link-server"
description = "Storage and forwarding for messages between MoaT instances"
readme = "README.md"

[[project.authors]]
name = "Matthias Urlichs"
email = "matthias@urlichs.de"

[project.urls]
homepage = "https://m-o-a-t.org"
repository = "https://github.com/M-o-a-T/moat"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
