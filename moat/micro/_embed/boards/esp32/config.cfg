# This is the configuration template for an ESP port.
#
micro:
  setup:
    args:
      config: !P cfg.r
    app:
      app: dir
      r:
        app: serial.Raw
        port: !P :@.cfg.serial.run
        mode:
          rate: &rs 115200
          dtr_flip: true
          rts_flip: true
          dtr_state: false
          rts_state: false
          dtr_rts: 0.1

    run:
      app:
        app: dir
        t:
          app: net.tcp.Link
          host: !P :@.cfg.net.addr
          port: &moat_port 27589

        n:
          app: net.unix.Port
          port: !P :@.cfg.socket

    install:
      port: esp32
      board: !P :@.cfg.board
      build: !P :@.cfg.tempdir

      serial: !P :@.cfg.serial.config
      rate: 400000

  cfg:
    r:
      app:
        app: dir
        net: !P :@.cfg.net
        i:
          app: i2c.Cmd
          id: 0
          d: 21
          c: 22
        wdt:
          app: wdt.Cmd
          t: 5000
          hw: true
        n:
          app: net.tcp.Port
          host: !P :@.cfg.net.addr
          port: *moat_port 27589
        s:
          app: _sys.Cmd
        c:
          app: cfg.Cmd
        f:
          app: fs.Cmd

  connect:
    app:
      app: dir
      r:
        app: net.unix.Link
        port: !P :@.cfg.socket

      remote: !P r.t
      path:
        fs: !P f
        sys: !P s
        cfg: !P c

  run:
    app:
      app: dir
      t:
        app: net.tcp.Link
        host: !P :@.cfg.net.addr
        port: &moat_port 27589

      n:
        app: net.unix.Port
        port: !P :@.cfg.socket
