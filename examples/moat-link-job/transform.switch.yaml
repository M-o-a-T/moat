default: {}
info: Switch input range during polling
is_async: true
vars:
- src
- dst
- flip
- high
- low
tests:
  basic:
    info: switch to the high range above "high", back below "low"
    timeout: 10
    args:
      src: !P in
      dst: !P out
      flip: !P flip
      low: 1
      high: 4
    steps:
    - [monitor, out, !P out]
    - [monitor, flip, !P flip]
    - [start]
    - [wait, 3, "flip == [False]"]
    - [set, !P in, 2]
    - [wait, 3, "out == [2]"]
    - [set, !P in, 5]
    - [wait, 3, "flip == [False, True]"]
    - [set, !P in, 3]
    - [wait, 3, "out == [2, 6]"]
    - [set, !P in, 0.5]
    - [wait, 3, "flip == [False, True, False]"]
    - [set, !P in, 2]
    - [wait, 3, "out == [2, 6, 2]"]
    - [check, "len(flip) == 3"]
  inverted:
    info: low > high (as in production); the stored switch state is used
    timeout: 10
    data:
      flip:
        _: false
    args:
      src: !P in
      dst: !P out
      flip: !P flip
      low: 4
      high: 1
    steps:
    - [monitor, out, !P out]
    - [monitor, flip, !P flip]
    - [start]
    - [sleep, 0.3]
    - [set, !P in, 3]
    - [wait, 3, "out == [6]"]
    - [set, !P in, 0.5]
    - [wait, 3, "flip == [False, True]"]
    - [set, !P in, 2]
    - [wait, 3, "out == [6, 2]"]
    - [set, !P in, 5]
    - [wait, 3, "flip == [False, True, False]"]
