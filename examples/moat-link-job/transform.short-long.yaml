          if timer is not None:
              timer.cancel()
          if msg.value is not _cls.NotGiven and msg.value:
              timer = await _self.timer(seconds)
          elif timer is not None:
              # released before the timer ran out: short press
              timer = None
              await _link.set(dst1, s1)
