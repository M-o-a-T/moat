        type: float
        unit: W
      apparent:
        register: 0x32
        type: float
        unit: VA
      reactive:
        register: 0x2A
        type: float
        unit: VAr
    sum:
      active:
        register: 0x1C
        type: float
        unit: W
      apparent:
        register: 0x2C
        type: float
        unit: VA
      reactive:
        register: 0x26
        type: float
        unit: VAr
  frequency:
    register: 0x14
    type: float
    unit: Hz
