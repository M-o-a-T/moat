prefix: !P wago

# There is no "server" entry, that's stored in the MoaT-Link node
server_default:
  port: 29995

# poll frequency: server
poll: 0.1

# ping frequency: server
ping: 5

# for counter reporting: port
interval: 1

# Pulses up=True/down=False/both=None, default Up: port
count: true

# Per-port worker retry / back-off. Passed to `LinkSender.retrying`.
# See `moat.link.client.LinkSender.retrying` for the full key list.
backoff:
  initial: 0.5   # delay before the first retry (sec)
  max: 300       # maximum delay between retries (sec)
  exp: 1.4       # exponential back-off exponent
  wait: 30       # time for a worker to reach readiness (sec)
  up: 5          # sec a worker must stay up before reporting OK
