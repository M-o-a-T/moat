  class Src(_cls.ChangeMsg): pass
  class Low(_cls.ChangeMsg): pass
  class High(_cls.ChangeMsg): pass
  class D_Low(_cls.ChangeMsg): pass
  class D_High(_cls.ChangeMsg): pass

  # Thresholds and output values that are paths are watched.
  n = 1
  await _self.watch(src, cls=Src)
  if isinstance(low, Path):
      await _self.watch(low, cls=Low)
      low = None
      n += 1
  if isinstance(high, Path):
      await _self.watch(high, cls=High)
      high = None
      n += 1
  if isinstance(d_low, Path):
      await _self.watch(d_low, cls=D_Low)
      d_low = None
      n += 1
  if isinstance(d_high, Path):
      await _self.watch(d_high, cls=D_High)
      d_high = None
      n += 1

  ready = False
  is_high = None  # unknown: the next value beyond a threshold decides
  data = None

  async for msg in _info:
      if isinstance(msg, _cls.ReadyMsg):
          if msg.msg < n:
              continue
          ready = True
          # Start from the current output, if there is one.
          try:
              cur = await _link.get(dst)
          except KeyError:
              pass
          else:
              try:
                  is_high = cur >= (d_high + d_low) / 2
              except TypeError:
                  _log.debug("Output %r: state unknown", cur)
              else:
                  if d_high < d_low:
                      is_high = not is_high
      elif isinstance(msg, _cls.ChangeMsg):
          # a deleted entry is unknown
          val = None if msg.value is _cls.NotGiven else msg.value
          if isinstance(msg, Low):
              low = val
          elif isinstance(msg, High):
              high = val
          elif isinstance(msg, D_Low):
              d_low = val
          elif isinstance(msg, D_High):
              d_high = val
          elif isinstance(msg, Src):
              data = val
      else:
          continue

      if not ready or data is None or None in (low, high, d_low, d_high):
          continue
      _log.debug("Data %r %r %r/%r %r/%r", is_high, data, low, high, d_low, d_high)
      if is_high is not False and data <= low:
          is_high = False
          await _link.set(dst, d_low)
      elif is_high is not True and data >= high:
          is_high = True
          await _link.set(dst, d_high)
default:
  d_high: true
  d_low: false
  high: 0.6
  low: 0.4
info: 'Hysteresis: dst is d_high once src >= high, d_low once src <= low'
is_async: true
vars:
- src
- dst
tests:
  basic:
    info: switches at the thresholds, not in between
    timeout: 10
    data:
      in:
        _: 0.5
    args:
      src: !P in
      dst: !P out
    steps:
    - [monitor, out, !P out]
    - [start]
    - [sleep, 0.3]
    - [check, "out == []"]
    - [set, !P in, 0.7]
    - [wait, 3, "out == [True]"]
    - [set, !P in, 0.5]
    - [set, !P in, 0.65]
    - [set, !P in, 0.45]
    - [sleep, 0.3]
    - [check, "out == [True]"]
    - [set, !P in, 0.4]
    - [wait, 3, "out == [True, False]"]
    - [set, !P in, 0.6]
    - [wait, 3, "out == [True, False, True]"]
  current:
    info: the current output decides which threshold applies first
    timeout: 10
    data:
      in:
        _: 25
      out:
        _: 1
    args:
      src: !P in
      dst: !P out
      low: 10
      high: 20
      d_low: 0
      d_high: 1
    steps:
    - [monitor, out, !P out]
    - [start]
    - [set, !P in, 30]
    - [set, !P in, 15]
    - [sleep, 0.3]
    - [check, "out == [1]"]
    - [set, !P in, 5]
    - [wait, 3, "out == [1, 0]"]
  inverted:
    info: d_high may be lower than d_low
    timeout: 10
    data:
      in:
        _: 15
      out:
        _: 100
    args:
      src: !P in
      dst: !P out
      low: 10
      high: 20
      d_low: 100
      d_high: 0
    steps:
    - [monitor, out, !P out]
    - [start]
    - [set, !P in, 5]
    - [sleep, 0.3]
    - [check, "out == [100]"]
    - [set, !P in, 25]
    - [wait, 3, "out == [100, 0]"]
  paths:
    info: thresholds and outputs can be paths; changing them re-evaluates
    timeout: 10
    data:
      in:
        _: 15
      lo:
        _: 10
      hi:
        _: 20
      d_off:
        _: "off"
      d_on:
        _: "on"
    args:
      src: !P in
      dst: !P out
      low: !P lo
      high: !P hi
      d_low: !P d_off
      d_high: !P d_on
    steps:
    - [monitor, out, !P out]
    - [start]
    - [set, !P in, 25]
    - [wait, 3, "out == ['on']"]
    - [set, !P lo, 30]
    - [wait, 3, "out == ['on', 'off']"]
    - [set, !P in, 5]
    - [set, !P lo, 10]
    - [set, !P d_on, "ON"]
    - [sleep, 0.3]
    - [check, "out == ['on', 'off']"]
    - [set, !P in, 25]
    - [wait, 3, "out == ['on', 'off', 'ON']"]
