default:
  seconds: 0.5
  state1: null
  state2: null
info: 'Button: a short press toggles dst1, a long press toggles dst2. state1/state2 optionally describe their current state.'
is_async: true
vars:
- src
- dst1
- dst2
- state1
- state2
- seconds
tests:
  toggle:
    info: without state paths, each press toggles its output
    timeout: 10
    args:
      src: !P in
      dst1: !P a
      dst2: !P b
      seconds: 0.4
    steps:
    - [monitor, a, !P a]
    - [monitor, b, !P b]
    - [start]
    - [wait, 3, "a == [False] and b == [False]"]
    - [sleep, 0.2]
    - [comment, short press]
    - [set, !P in, true]
    - [sleep, 0.1]
    - [set, !P in, false]
    - [wait, 3, "a == [False, True]"]
    - [set, !P in, true]
    - [sleep, 0.1]
    - [set, !P in, false]
    - [wait, 3, "a == [False, True, False]"]
    - [comment, long press]
    - [set, !P in, true]
    - [wait, 3, "b == [False, True]"]
    - [set, !P in, false]
    - [sleep, 0.3]
    - [check, "a == [False, True, False] and b == [False, True]"]
  state:
    info: with state paths (as in production), the outputs follow the state
    timeout: 10
    data:
      st1:
        _: false
      st2:
        _: true
    args:
      src: !P in
      dst1: !P a
      dst2: !P b
      state1: !P st1
      state2: !P st2
      seconds: 0.4
    steps:
    - [monitor, a, !P a]
    - [monitor, b, !P b]
    - [start]
    - [wait, 3, "a == [False] and b == [False]"]
    - [sleep, 0.2]
    - [set, !P in, true]
    - [sleep, 0.1]
    - [set, !P in, false]
    - [wait, 3, "a == [False, True]"]
    - [set, !P st1, true]
    - [sleep, 0.2]
    - [set, !P in, true]
    - [sleep, 0.1]
    - [set, !P in, false]
    - [wait, 3, "a == [False, True, False]"]
    - [set, !P in, true]
    - [wait, 3, "b == [False, False]"]
    - [set, !P in, false]
  delay:
    info: the delay can be a path; a pressed button at startup is ignored
    timeout: 10
    data:
      in:
        _: true
      dly:
        _: 0.2
    args:
      src: !P in
      dst1: !P a
      dst2: !P b
      seconds: !P dly
    steps:
    - [monitor, a, !P a]
    - [monitor, b, !P b]
    - [start]
    - [sleep, 0.5]
    - [check, "a == [False] and b == [False]"]
    - [set, !P in, false]
    - [sleep, 0.2]
    - [check, "a == [False] and b == [False]"]
    - [set, !P in, true]
    - [wait, 3, "b == [False, True]"]
    - [set, !P in, false]
    - [set, !P dly, 5]
    - [sleep, 0.2]
    - [set, !P in, true]
    - [sleep, 0.5]
    - [set, !P in, false]
    - [wait, 3, "a == [False, True]"]
