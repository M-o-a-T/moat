name: ts-moat-lib-rpc

on:
  push:
    paths:
      - 'ts/moat-lib-rpc/**'
      - '.github/workflows/ts-moat-lib-rpc.yml'
    tags:
      - 'ts/moat-lib-rpc-*'
  pull_request:
    paths:
      - 'ts/moat-lib-rpc/**'

defaults:
  run:
    working-directory: ts/moat-lib-rpc

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ts/moat-lib-rpc/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ts/moat-lib-rpc/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ts/moat-lib-rpc/coverage/

  test-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ts/moat-lib-rpc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
        working-directory: ts/moat-lib-rpc
      - name: Install Python dependencies
        working-directory: .
        run: |
          pip install -e ".[test]" || true
      - name: Regenerate golden vectors
        working-directory: ts/moat-lib-rpc
        run: python3 scripts/golden-gen.py
      - name: Run interop tests
        working-directory: ts/moat-lib-rpc
        env:
          REQUIRE_INTEROP: '1'
        run: npx vitest run --config vitest.interop.config.ts

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ts/moat-lib-rpc/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-min.mjs
      - run: npm pack --dry-run
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ts/moat-lib-rpc/dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build, test-interop]
    if: startsWith(github.ref, 'refs/tags/ts/moat-lib-rpc-')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ts/moat-lib-rpc/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-min.mjs
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
