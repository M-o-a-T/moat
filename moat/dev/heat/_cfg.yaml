# Package defaults of the heat controller.
#
# Each unit's configuration is this subtree merged with the MoaT-Link item
# ``cfg.app.heat.<unit>``; the Link item takes precedence.

service:
  host: heat

emergency: {}

target: {}
heat_valve: {}
flow:
  # production values (solvis.yml)
  max_max: 61
  flow:  # flow rate -> PWM
    p: 0.02
    i: 0.0003
    min: 0.25
    max: 0.95
    log:
      value: !P heat.s.pump.pct.flow
      setpoint: !P heat.s.pump.set.flow
  pump:  # outflow temperature -> PWM
    p: -0.02
    i: -0.0003
    d: -0.2
    tf: 30
    min: 0.25
    max: 1
    log:
      value: !P heat.s.pump.pct.pump
      setpoint: !P heat.s.pump.set.pump
pump: {}
pellet: {}
selector: {}
errors: {}
watchdog: {}
passthru: {}
